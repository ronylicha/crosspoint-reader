name: Sync upstream CrossPoint release

# Vérifie chaque jour si une nouvelle release officielle de CrossPoint Reader
# est sortie. Si oui : merge de l'upstream dans develop, build des firmwares
# X4 Pro (tactile, avec les jeux) et X4/X3 (boutons, sans les jeux), puis
# publication d'une release v<version>-games.N avec les deux .bin.
# Déclenchement manuel possible depuis l'onglet Actions (workflow_dispatch).

on:
  schedule:
    - cron: "17 6 * * *" # tous les jours à 06:17 UTC
  workflow_dispatch:
    inputs:
      force_version:
        description: "Forcer une version upstream précise (ex. 1.6.6). Vide = dernière release officielle."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# Deux exécutions simultanées publieraient deux fois la même version.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du fork (branche develop)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Récupérer l'upstream et déterminer la dernière release officielle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_version }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/crosspoint-reader/crosspoint-reader.git || true
          git fetch upstream --tags

          if [ -n "$FORCE" ]; then
            UPSTREAM_TAG="$FORCE"
          else
            # releases/latest = dernière release non-prerelease de l'upstream
            UPSTREAM_TAG=$(gh api repos/crosspoint-reader/crosspoint-reader/releases/latest --jq .tag_name)
          fi
          # Les tags upstream sont nus (1.6.5) ; tolérer un éventuel préfixe v.
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "Dernière release officielle : $UPSTREAM_TAG"

          # Dernière version upstream déjà intégrée au fork (tags vX.Y.Z-games.N)
          LAST=$(git tag -l 'v*-games.*' | sed 's/^v//; s/-games\./ /' | sort -V -k1,1 -k2,2n | tail -1 | cut -d' ' -f1)
          echo "Dernière base intégrée : ${LAST:-aucune}"

          # Les étapes suivantes tournent dans d'autres shells : tout passe par GITHUB_ENV.
          {
            echo "UPSTREAM_TAG=$UPSTREAM_TAG"
            echo "UPSTREAM_VERSION=$UPSTREAM_VERSION"
            echo "LAST=$LAST"
          } >> "$GITHUB_ENV"

      - name: Vérifier si une resynchronisation est nécessaire
        id: check
        run: |
          if [ -n "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$UPSTREAM_VERSION" | sort -V | tail -1)" = "$LAST" ]; then
            echo "Le fork est déjà à jour ($LAST >= $UPSTREAM_VERSION). Rien à faire."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle release officielle détectée : $UPSTREAM_VERSION"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge de l'upstream dans develop
        if: steps.check.outputs.needed == 'true'
        id: merge
        run: |
          set -e
          if git merge --no-edit "$UPSTREAM_TAG"; then
            echo "Merge réussi."
          else
            echo "::error::Conflit de merge avec l'upstream $UPSTREAM_TAG — intervention manuelle requise."
            git merge --abort || true
            exit 1
          fi

      - name: Ouvrir un ticket en cas de conflit
        if: failure() && steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/issue.md <<EOF
          La synchronisation automatique avec la release officielle **${UPSTREAM_TAG}** a échoué (conflits de merge ou build).

          Zones du fork les plus exposées : barre d'onglets et accueil (\`src/components/AppNavigation.*\`, \`src/activities/home/\`), thèmes (\`src/components/themes/\`), bibliothèque (\`src/activities/library/\`), réglages (\`src/activities/settings/\`, \`src/CrossPointSettings.*\`), lecteur (\`src/activities/reader/ReaderActivity.*\`) et fichiers i18n.

          À faire manuellement :
          \`\`\`bash
          git checkout develop
          git fetch https://github.com/crosspoint-reader/crosspoint-reader.git --tags
          git merge ${UPSTREAM_TAG}
          # résoudre les conflits, puis :
          pio run -e x4pro -e gh_release
          \`\`\`
          EOF
          gh issue create --title "⚠️ Synchronisation avec CrossPoint $UPSTREAM_TAG en échec" --body-file /tmp/issue.md || true
          exit 1

      - name: Cache PlatformIO
        if: steps.check.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Build des firmwares X4 Pro et X4/X3
        if: steps.check.outputs.needed == 'true'
        run: |
          set -e
          pip install platformio pyyaml
          # x4pro : tactile, avec les jeux. gh_release : X4/X3 à boutons, sans les jeux.
          pio run -e x4pro -e gh_release
          mkdir -p dist
          cp .pio/build/x4pro/firmware.bin dist/firmware-x4pro-jeux.bin
          cp .pio/build/gh_release/firmware.bin dist/firmware-x4.bin
          ls -la dist

      - name: Tag et release
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git push origin develop

          # Itération : -games.1 sauf si le tag existe déjà (-> .2, .3...)
          N=1
          while git rev-parse -q --verify "refs/tags/v${UPSTREAM_VERSION}-games.${N}" >/dev/null; do N=$((N+1)); done
          TAG="v${UPSTREAM_VERSION}-games.${N}"
          git tag "$TAG"
          git push origin "$TAG"

          # Même description du fork que les releases publiées à la main.
          export UPSTREAM_VERSION
          envsubst '${UPSTREAM_VERSION}' < .github/release-notes-fork.md > /tmp/notes.md

          gh release create "$TAG" \
            --repo ronylicha/crosspoint-reader \
            --target develop \
            --title "${TAG} — Interface à onglets, statistiques, bibliothèque et jeux" \
            --notes-file /tmp/notes.md \
            dist/firmware-x4pro-jeux.bin \
            dist/firmware-x4.bin
